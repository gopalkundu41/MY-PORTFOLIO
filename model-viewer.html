<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Bicycle Model — Interactive Exploded Viewer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f7f7f7;color:#eee;font-family:Segoe UI,Arial,sans-serif}
#viewer{position:fixed;inset:0}
#toolbar{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;
  background:#15191fe8;border:1px solid #343a42;border-radius:12px;
  padding:8px 10px;backdrop-filter:blur(6px);
}
#toolbar button{
  display:flex;align-items:center;gap:6px;
  padding:9px 14px;border:1px solid #3b424b;border-radius:8px;
  background:#20262e;color:#fff;cursor:pointer;font-size:12.5px;white-space:nowrap;
}
#toolbar button:hover{background:#2a323b}
#toolbar button.active{background:#2c6e63;border-color:#3d9484}
#toolbar .divider{width:1px;height:26px;background:#343a42;margin:0 2px}
#toolbar .slider-wrap{display:flex;align-items:center;gap:8px;padding:0 6px}
#toolbar input[type=range]{width:110px}
#toolbar #pct{font-size:11px;color:#a3abb5;font-family:monospace;min-width:32px;text-align:right}
#hint{position:fixed;left:14px;top:14px;background:#15191ddd;border:1px solid #343a42;border-radius:7px;padding:7px 9px;font-size:11px;color:#a3abb5}
#status{position:fixed;right:14px;top:14px;max-width:260px;background:#15191ddd;border:1px solid #343a42;border-radius:7px;padding:8px 10px;font-size:11px;color:#a3abb5;line-height:1.45;display:none}
#status.show{display:block}
#viewer.selecting{cursor:crosshair}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}
</script>
</head>
<body>
<div id="viewer"></div>
<div id="hint">Click a component on the 3D model to isolate it</div>
<div id="status"></div>

<div id="toolbar">
  <div class="slider-wrap">
    <span style="font-size:11px;color:#a3abb5;">Explode</span>
    <input id="slider" type="range" min="0" max="100" value="0">
    <span id="pct">0%</span>
  </div>
  <div class="divider"></div>
  <button id="play">▶ Explode</button>
  <button id="reset">↺ Reset</button>
  <button id="edges">Toggle Edges</button>
</div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {DRACOLoader} from "three/addons/loaders/DRACOLoader.js";

const $=x=>document.getElementById(x);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf7f7f7);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.001,10000);
camera.position.set(3,2.4,4);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
renderer.toneMappingExposure=1;
$("viewer").appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.08;

scene.add(new THREE.HemisphereLight(0xffffff,0x888888,2.2));
let key=new THREE.DirectionalLight(0xffffff,1.4);key.position.set(4,6,8);scene.add(key);
let fill=new THREE.DirectionalLight(0xffffff,1.0);fill.position.set(-4,3,5);scene.add(fill);
let rim=new THREE.DirectionalLight(0xffffff,.6);rim.position.set(0,4,-6);scene.add(rim);

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

let root,meshes=[],originals=[],modelSize=1,playing=false,edges=false;
let selectedIndex=-1;
const originalMaterials=new Map();

function getBox(obj){obj.updateWorldMatrix(true,true);return new THREE.Box3().setFromObject(obj)}

function frameObject(obj,padding=3){
 const box=getBox(obj);if(box.isEmpty())return;
 const center=box.getCenter(new THREE.Vector3());
 const size=box.getSize(new THREE.Vector3());
 const radius=Math.max(size.x,size.y,size.z)*.5||.01;
 const distance=radius/Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))*padding;
 let dir=camera.position.clone().sub(controls.target);
 if(dir.lengthSq()<1e-8)dir.set(1,1,1);
 dir.normalize();
 controls.target.copy(center);
 camera.position.copy(center).add(dir.multiplyScalar(distance));
 camera.near=Math.max(radius/1000,.00001);
 camera.far=Math.max(distance*20,100);
 camera.updateProjectionMatrix();
 controls.update();
}

function frameWhole(){
 const box=getBox(root),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 const radius=Math.max(...size.toArray())*.5||1;
 const distance=radius/Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))*1.8;
 controls.target.copy(center);
 camera.position.set(center.x+distance*.8,center.y+distance*.65,center.z+distance);
 camera.near=Math.max(radius/100000,.00001);
 camera.far=Math.max(distance*20,100);
 camera.updateProjectionMatrix();
 controls.update();
}

function addEdges(m){
 const e=new THREE.EdgesGeometry(m.geometry,35);
 const line=new THREE.LineSegments(e,new THREE.LineBasicMaterial({color:0x111111,transparent:true,opacity:.55,depthWrite:false}));
 line.userData.viewerEdge=true;
 m.add(line);
 m.userData.viewerEdge=line;
}

function build(){
 meshes=[];
 root.traverse(o=>{if(o.isMesh)meshes.push(o)});
 root.updateMatrixWorld(true);

 originals=meshes.map(m=>({
   position:m.position.clone(),
   quaternion:m.quaternion.clone(),
   scale:m.scale.clone(),
   center:getBox(m).getCenter(new THREE.Vector3())
 }));

 meshes.forEach((m,i)=>{
   originalMaterials.set(m,m.material);
   addEdges(m);
   if(m.userData.viewerEdge) m.userData.viewerEdge.visible = edges;
 });
}

function restoreAllMaterials(){
 meshes.forEach(m=>{
   const original=originalMaterials.get(m);
   if(original)m.material=original;
 });
}

function setIsolation(index){
 meshes.forEach((m,i)=>{
   const original=originalMaterials.get(m);
   if(!original)return;

   if(i===index){
     const highlight=original.clone();
     highlight.transparent=false;
     highlight.opacity=1;
     highlight.depthWrite=true;
     if("emissive" in highlight){
       highlight.emissive=new THREE.Color(0x234e78);
       highlight.emissiveIntensity=.65;
     }
     m.material=highlight;
   }else{
     const ghost=original.clone();
     ghost.transparent=true;
     ghost.opacity=.08;
     ghost.depthWrite=false;
     m.material=ghost;
   }
 });
}

function updateList(index){
 // No component list in the UI anymore; kept as a no-op hook for future use.
}

function selectComponent(index,zoom=true){
 if(index<0||index>=meshes.length)return;
 selectedIndex=index;
 updateList(index);
 setIsolation(index);
 const m=meshes[index];

 showStatus("<b>Selected:</b> "+(m.name||"Component")+"<br>Other components are transparent.");
 if(zoom)frameObject(m,3.0);
}

function showStatus(html){
 const el=$("status");
 el.innerHTML=html;
 el.classList.add("show");
}

function hideStatus(){
 $("status").classList.remove("show");
}

function clearSelection(){
 selectedIndex=-1;
 restoreAllMaterials();
 hideStatus();
}

function explode(v){
 $("pct").textContent=Math.round(v)+"%";
 if(!meshes.length)return;
 const t=v/100;
 const box=new THREE.Box3();
 originals.forEach(o=>box.expandByPoint(o.center));
 const center=box.getCenter(new THREE.Vector3());

 meshes.forEach((m,i)=>{
   const o=originals[i];
   const dir=o.center.clone().sub(center);
   if(dir.lengthSq()<1e-10)dir.set(0,1,0);
   dir.normalize();
   m.position.copy(o.position).add(dir.multiplyScalar(modelSize*.9*t));
   m.quaternion.copy(o.quaternion);
   m.scale.copy(o.scale);
 });
}

// Select a mesh directly from the 3D model.
function pickFromModel(event){
 const rect=renderer.domElement.getBoundingClientRect();
 mouse.x=((event.clientX-rect.left)/rect.width)*2-1;
 mouse.y=-((event.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(mouse,camera);

 // Only test actual assembly meshes, not the generated edge lines.
 const hits=raycaster.intersectObjects(meshes,false);
 if(!hits.length){
   if(selectedIndex!==-1)clearSelection();
   return;
 }

 const hit=hits[0].object;
 const index=meshes.indexOf(hit);
 if(index!==-1)selectComponent(index,true);
}

renderer.domElement.addEventListener("click",pickFromModel);

function addContactShadow(box){
 const size=Math.max(box.getSize(new THREE.Vector3()).x,box.getSize(new THREE.Vector3()).z)*1.8||1;
 const canvas=document.createElement("canvas");
 canvas.width=256;canvas.height=256;
 const ctx=canvas.getContext("2d");
 const grd=ctx.createRadialGradient(128,128,0,128,128,128);
 grd.addColorStop(0,"rgba(0,0,0,0.32)");
 grd.addColorStop(0.6,"rgba(0,0,0,0.12)");
 grd.addColorStop(1,"rgba(0,0,0,0)");
 ctx.fillStyle=grd;
 ctx.fillRect(0,0,256,256);
 const tex=new THREE.CanvasTexture(canvas);
 const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false});
 const geo=new THREE.PlaneGeometry(size,size);
 const shadow=new THREE.Mesh(geo,mat);
 shadow.rotation.x=-Math.PI/2;
 const center=box.getCenter(new THREE.Vector3());
 shadow.position.set(center.x,box.min.y+0.001,center.z);
 shadow.renderOrder=-1;
 scene.add(shadow);
}

function load(){
 const dracoLoader=new DRACOLoader();
 dracoLoader.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.7/");
 const gltfLoader=new GLTFLoader();
 gltfLoader.setDRACOLoader(dracoLoader);
 gltfLoader.load("3D_TEST_MODEL_FOR_WEB.glb",g=>{
   root=g.scene;
   scene.add(root);
   build();

   const b=getBox(root),s=b.getSize(new THREE.Vector3());
   modelSize=Math.max(...s.toArray())||1;
   addContactShadow(b);

   frameWhole();
   explode(0);
 },undefined,e=>{
   console.error(e);
   showStatus("<b>Load failed.</b><br>"+(e.message||e));
 });
}

$("slider").oninput=e=>explode(+e.target.value);

$("reset").onclick=()=>{
 // Explicitly restore EVERY component and remove selection.
 $("slider").value=0;
 playing=false;
 $("play").classList.remove("active");
 explode(0);
 clearSelection();
 frameWhole();
};

$("play").onclick=()=>{
 playing=!playing;
 $("play").classList.toggle("active",playing);
};

$("edges").onclick=()=>{
 edges=!edges;
 $("edges").classList.toggle("active",edges);
 meshes.forEach(m=>{
   if(m.userData.viewerEdge)m.userData.viewerEdge.visible=edges;
 });
};

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=(now-last)/1000;last=now;

 if(playing){
   let v=+$("slider").value+dt*30;
   if(v>=100){v=100;playing=false;$("play").classList.remove("active")}
   $("slider").value=v;
   explode(v);
 }

 controls.update();
 renderer.render(scene,camera);
}

load();
loop(performance.now());
</script>
</body>
</html>
